# Alembic 配置文件
# 说明：实际的 DSN 由 alembic/env.py 从 app.core.config.settings 注入
#       这里 sqlalchemy.url 留空即可，避免敏感信息硬编码

[alembic]
# 迁移脚本目录
script_location = alembic

# 版本文件名模板：日期 + 短哈希，便于按时间排序
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# 时区（生成版本号用）
timezone = Asia/Shanghai

# 截断 slug 长度
truncate_slug_length = 40

# 使用纯路径分隔符（跨平台）
version_path_separator = os

# 迁移脚本编码
output_encoding = utf-8

# 占位，真实 DSN 在 env.py 注入
sqlalchemy.url =


[post_write_hooks]
# 可选：用 ruff 自动格式化生成的迁移文件
hooks = ruff
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = format REVISION_SCRIPT_FILENAME


# ---------- 日志 ----------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
